openapi: 3.2.0
info:
  title: End Close Reconciliation Exceptions API
  description: REST API is used to interact with the End Close platform.
  license:
    name: MIT
  version: 1.0.0
servers:
- url: https://api.endclose.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Reconciliation Exceptions
paths:
  /reconciliation_exceptions:
    get:
      summary: List reconciliation exceptions
      description: Returns a paginated list of exceptions, optionally filtered by reconciliation or status. Each row includes data-stream metadata and an aggregates summary so you can render a queue without a follow-up request per row. Results are ordered by `created_at` descending, then `id` descending — a stable total order, so paging through the full list with `offset` returns every row exactly once even when many rows share a `created_at`.
      parameters:
      - in: query
        name: reconciliation_id
        schema:
          type: string
        description: Filter by reconciliation
      - in: query
        name: status
        schema:
          type: string
          enum:
          - open
          - investigating
          - dismissed
          - resolved
        description: Filter by exception status
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: offset
        schema:
          type: integer
        description: Pagination offset
      responses:
        '200':
          description: Paginated list of exceptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationException'
                  has_more:
                    type: boolean
                  offset:
                    type: number
        '401':
          description: Unauthorized
      tags:
      - Reconciliation Exceptions
      operationId: getReconciliationExceptions
      x-operation-id-source: derived
    post:
      summary: Create a reconciliation exception
      description: Create an exception for a reconciliation and data stream. Only one `open` or `investigating` exception can exist per (data stream, reconciliation) pair at a time. `title` defaults to `"{data_stream_name} — overdue records"`, and `status` defaults to `open`. The system automatically creates exceptions via its overdue sweeper — use this endpoint when you want to open one manually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reconciliation_id
              - data_stream_id
              properties:
                reconciliation_id:
                  type: string
                  description: Reconciliation the exception belongs to
                data_stream_id:
                  type: string
                  description: Data stream the exception is scoped to. Must belong to the reconciliation.
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum:
                  - open
                  - investigating
                  - dismissed
                  - resolved
                  default: open
      responses:
        '201':
          description: Exception created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationException'
        '401':
          description: Unauthorized
        '404':
          description: Reconciliation or data stream not found
        '422':
          description: Validation failed, or a duplicate open/investigating exception already exists for this (data stream, reconciliation)
      tags:
      - Reconciliation Exceptions
      operationId: postReconciliationExceptions
      x-operation-id-source: derived
  /reconciliation_exceptions/{id}:
    get:
      summary: Retrieve a reconciliation exception
      description: Returns the exception with assignees, comments, recent investigation sessions, `aggregates` for the entire overdue slice, and `filtered_aggregates` restricted to the supplied filter query parameters. All filter parameters are optional.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: amount_min
        schema:
          type: integer
        description: Include records with signed amount >= amount_min (cents)
      - in: query
        name: amount_max
        schema:
          type: integer
        description: Include records with signed amount <= amount_max (cents)
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Include records with transaction date >= date_from
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Include records with transaction date <= date_to
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - debit
          - credit
        description: Include only debits (amount < 0) or credits (amount > 0)
      - in: query
        name: counterparty
        schema:
          type: string
        description: Case-insensitive substring match on record description
      - in: query
        name: age_bucket
        schema:
          type: string
          enum:
          - lt_7d
          - 7_30d
          - 30_90d
          - gt_90d
        description: Convenience age filter on time since `overdue_at`
      responses:
        '200':
          description: Exception retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationException'
        '401':
          description: Unauthorized
        '404':
          description: Exception not found
      tags:
      - Reconciliation Exceptions
      operationId: getReconciliationExceptionsById
      x-operation-id-source: derived
    patch:
      summary: Update a reconciliation exception
      description: Update the title, description, or status of an exception.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum:
                  - open
                  - investigating
                  - dismissed
                  - resolved
      responses:
        '200':
          description: Exception updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationException'
        '404':
          description: Exception not found
      tags:
      - Reconciliation Exceptions
      operationId: patchReconciliationExceptionsById
      x-operation-id-source: derived
    delete:
      summary: Delete a reconciliation exception
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Exception deleted successfully
        '404':
          description: Exception not found
      tags:
      - Reconciliation Exceptions
      operationId: deleteReconciliationExceptionsById
      x-operation-id-source: derived
  /reconciliation_exceptions/{id}/findings:
    put:
      summary: Write findings for an exception's lines
      description: Upserts one finding per record of the exception — the note, status and suggested action your reviewers see on each open line. Findings are keyed on (exception, record), so sending the same record again replaces its finding. Up to 1,000 findings per request; each is validated independently and the response lists the rejected ones, so a partial batch still writes. Records already matched by rules do not need findings — write them for the lines that are left.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingsUpsertRequest'
      responses:
        '200':
          description: Findings written (possibly with per-finding errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingsUpsertResult'
        '401':
          description: Unauthorized
        '404':
          description: Exception not found
        '422':
          description: '`findings` is not a list, or has more than 1,000 items'
      tags:
      - Reconciliation Exceptions
      operationId: putReconciliationExceptionsByIdFindings
      x-operation-id-source: derived
  /reconciliation_exceptions/{id}/review:
    get:
      summary: Read the review of an exception
      description: Returns the exception's findings with each line's derived status, filtered and paged. Lines sort `to_look_at` first, then `looks_right`, then `done`; within a status, newest record date first. `sort` puts a column in front of that order.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - all
          - to_look_at
          - looks_right
          - done
          default: to_look_at
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive substring match on the record's description, external id, `metadata.client_name` or `metadata.line_num`, or the finding's note or category
      - in: query
        name: category
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Only lines whose finding is in one of these categories (exact match). Repeat the parameter for several.
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - date
          - description
          - category
          - amount
          - other_amount
          - difference
          - quantity
          - other_quantity
          - quantity_difference
          - status
        description: Column to sort by. Amounts sort on magnitude; `difference` and `quantity_difference` on the signed gap; lines with nothing in the column come last. Unknown values keep the review order.
      - in: query
        name: dir
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: per_page
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: A page of the review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '401':
          description: Unauthorized
        '404':
          description: Exception not found
        '422':
          description: The exception's data stream is no longer on the reconciliation
      tags:
      - Reconciliation Exceptions
      operationId: getReconciliationExceptionsByIdReview
      x-operation-id-source: derived
components:
  schemas:
    ReviewPage:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ReviewRow'
        counts:
          $ref: '#/components/schemas/ReviewCounts'
        categories:
          type: array
          description: Every finding category on the exception with how many lines carry it, most common first — counted over the whole exception, not the current filter.
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
          description: Rows matching the current `status`, `category` and `q` filters.
        sides:
          type: object
          description: '`{ a: { data_stream_id, name }, b: { data_stream_id, name } }`'
        row_side:
          type: string
          enum:
          - a
          - b
          description: Which side the exception's lines are on.
        pending_notes:
          type: integer
          description: Overdue lines of this exception that have no finding yet.
    FindingInput:
      type: object
      required:
      - note
      description: One line of the review as your engine sees it. Identify the record by `record_id` or by `external_id` (resolved within the exception's data stream). `suggestion.record_ids` may be record ids or external ids from either side of the reconciliation; unknown ids reject the finding.
      properties:
        record_id:
          type: string
          description: The record's id. Required unless `external_id` is given.
        external_id:
          type: string
          description: The record's external id within the exception's data stream. Rejected when it matches more than one record.
        looks_right:
          type: boolean
          default: false
          description: '`true` when the line is correct as it stands and only needs the note. These lines can be confirmed in bulk.'
        note:
          type: string
          description: 'One or two plain sentences: what happened to this line and what was checked.'
        category:
          type: string
          nullable: true
          description: A short label for the kind of line, in your own words (e.g. `back-billing`, `monthly minimum`).
        suggestion:
          type: object
          description: What Approve applies. Omit, or use kind `none`, when there is nothing to apply.
          properties:
            kind:
              type: string
              enum:
              - match
              - adjust
              - none
              default: none
              description: '`match`: pair the line with `record_ids` (must balance). `adjust`: pair them and plug the remaining gap with an adjustment carrying `reason`. `none`: nothing to apply.'
            record_ids:
              type: array
              items:
                type: string
              description: Every other record of the proposed match, either side, as record ids or external ids.
            reason:
              type: string
              description: 'For `adjust`: why a gap remains. Becomes the adjustment''s description.'
            text:
              type: string
              description: The sentence shown next to the Approve button.
            difference_cents:
              type: integer
              description: Informational. Recomputed from the records as |side A| − |side B| whenever `record_ids` is given; only kept as sent for a one-sided `adjust`.
        evidence:
          type: array
          description: Quotes that back the note. A quote with a `url` marks the line as checked against a document in the review.
          items:
            type: object
            required:
            - quote
            properties:
              quote:
                type: string
              source:
                type: string
                nullable: true
                description: Where the quote is from, e.g. `Services Agreement, Exhibit B p.19`.
              url:
                type: string
                nullable: true
                description: 'An http(s) link to the document — for a file in End Close, the file''s `url`. End `#page=N` to open a PDF at that page: the review drawer labels the link “Open p.N” and shows the document inline. Other schemes are dropped.'
        precedent:
          type: string
          nullable: true
          description: How the same line was handled before, in one sentence.
        labels:
          type: object
          additionalProperties: true
          description: 'Free-form markers your reviewers care about, e.g. `{"carried_forward": true, "colour": "peach"}`. The review page reads `colour`, `colour_cell` and `carried_forward`; anything else is stored and returned untouched.'
    ReviewRow:
      type: object
      properties:
        record:
          allOf:
          - $ref: '#/components/schemas/ReconciliationEntry'
          description: The record as it stands in the exception's reconciliation.
        finding:
          $ref: '#/components/schemas/Finding'
        status:
          type: string
          enum:
          - to_look_at
          - looks_right
          - done
          description: 'Derived on read: `done` once the record is matched, else `looks_right` or `to_look_at` from the finding.'
        difference_cents:
          type: integer
          description: '|this line''s amount| − |finding.other_side.amount_cents|, in cents. Zero when nothing was found on the other side.'
        quantity:
          type: number
          nullable: true
          description: The line's count, read from the record's `metadata.quantity`, `qty`, `count`, `event_qty` or `units` (first present). Null when the record carries none.
        other_quantity:
          type: number
          nullable: true
          description: '`finding.other_side.count`, or null.'
        quantity_difference:
          type: number
          nullable: true
          description: '`quantity` − `other_quantity`; null unless both sides carry a count.'
    Record:
      type: object
      required:
      - date
      - data_stream_key
      - amount
      - direction
      properties:
        id:
          type: integer
        amount:
          type: integer
          description: The monetary amount in cents (e.g., 1234 = $12.34)
        currency:
          type: string
          description: Three-letter ISO 4217 currency code (e.g. USD, EUR). **Optional on create — defaults to `USD` when omitted.** Case-insensitive on input; always returned uppercase.
          pattern: ^[A-Za-z]{3}$
          default: USD
        decimal_places:
          type: integer
          description: Number of decimal places for this currency (2 for USD)
          default: 2
        direction:
          type: string
          enum:
          - credit
          - debit
        description:
          type: string
        date:
          type: string
          format: date
        metadata:
          type: object
          additionalProperties: true
          default: {}
        external_id:
          type: string
        data_stream_key:
          type: string
    ReviewCounts:
      type: object
      description: Counts of review lines by status. A line is `done` once its record is matched, `looks_right` when its finding says so and it is not yet matched, and `to_look_at` otherwise.
      properties:
        all:
          type: integer
        to_look_at:
          type: integer
        looks_right:
          type: integer
        done:
          type: integer
    AgentInvestigationSession:
      type: object
      description: 'An agent run against an exception: an `investigation` (one recommendation for the overdue slice) or a `row_review` (one finding per overdue line, read back through `GET /reconciliation_exceptions/{id}/review`). `investigation` and `investigation_sessions` on an exception only ever carry investigations.'
      properties:
        id:
          type: integer
        kind:
          type: string
          enum:
          - investigation
          - row_review
        status:
          type: string
          description: Investigation status (e.g. pending, running, completed, failed)
        outcome:
          type: string
          nullable: true
          enum:
          - match_found
          - no_match
          - needs_review
          - null
          description: Standardized outcome of a completed investigation. `match_found` = confident candidate matches; `no_match` = thorough search returned nothing; `needs_review` = candidates found but signals are weak. Null when the session is not yet completed or failed, and always null for a `row_review` session.
        recommendation_text:
          type: string
          nullable: true
          description: Agent's recommendation once the investigation completes
        confidence_score:
          type: number
          nullable: true
          description: Agent confidence in its recommendation (0.0-1.0)
        candidate_records_searched:
          type: integer
          nullable: true
          description: Number of candidate records the agent evaluated
        suggested_record_ids:
          type: array
          nullable: true
          items:
            type: integer
          description: Records the agent suggests linking to this exception
        filter_params:
          type: object
          nullable: true
          additionalProperties: true
          description: Filter parameters the session was scoped to, if any. Matches the filter shape on `GET /reconciliation_exceptions/{id}`.
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Finding:
      type: object
      description: 'A stored finding: the `FindingInput` fields as saved, plus provenance.'
      properties:
        id:
          type: string
        record_id:
          type: string
        looks_right:
          type: boolean
        note:
          type: string
        suggestion:
          type: object
          description: As `FindingInput.suggestion`, with `record_ids` resolved to record ids and `difference_cents` recomputed.
        evidence:
          type: array
          items:
            type: object
        precedent:
          type: string
          nullable: true
        other_side:
          type: object
          description: 'What the other column shows: `{ amount_cents, count, record_ids }` derived from the suggested records on the opposite side, or `{}`. `count` is the sum of those records'' counts (`metadata.quantity`, `qty`, `count`, `event_qty` or `units`, first present) and is only there when one of them carries one. You may send `amount_cents` and `count` yourself; a `count` you leave out is still derived.'
        category:
          type: string
          nullable: true
        labels:
          type: object
        source:
          type: string
          enum:
          - api
          - agent
          description: '`api` when written through this API; `agent` when written by End Close''s own review.'
        created_at:
          type: string
          format: date-time
    ReconciliationException:
      type: object
      required:
      - title
      - reconciliation_id
      - data_stream_id
      description: A reconciliation exception represents unmatched overdue records that need human attention. Exceptions are scoped to a (reconciliation, data_stream) tuple and managed by the sweeper job — record membership is computed on read from the set of unmatched records whose `overdue_at` has passed.
      properties:
        id:
          type: integer
        reconciliation_id:
          type: integer
          description: The reconciliation this exception belongs to
        reconciliation_name:
          type: string
          description: Name of the parent reconciliation
        data_stream_id:
          type: integer
          description: The data stream this exception is scoped to
        data_stream_name:
          type: string
          description: Human-readable name of the scoped data stream
        data_stream_key:
          type: string
          description: Immutable key of the scoped data stream
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - open
          - investigating
          - dismissed
          - resolved
          default: open
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        opened_at:
          type: string
          format: date-time
          nullable: true
          description: When the exception most recently transitioned into an open state. Distinct from `created_at` so reopening is tracked cleanly.
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: When the exception most recently transitioned into a resolved or dismissed state. Cleared on reopen.
        assignees:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              workos_user_id:
                type: string
        decimal_places:
          type: integer
          description: Number of decimal places (2 for USD)
          default: 2
        aggregates:
          allOf:
          - $ref: '#/components/schemas/ExceptionAggregates'
          description: Whole-exception aggregates over the current unmatched overdue slice.
        filtered_aggregates:
          allOf:
          - $ref: '#/components/schemas/ExceptionAggregates'
          description: Aggregates restricted to the filter query parameters. Equals `aggregates` when no filter is supplied. Only present on the show response.
        comments:
          type: array
          description: Comments on this exception, oldest first
          items:
            type: object
            properties:
              id:
                type: integer
              body:
                type: string
              author_workos_id:
                type: string
              mentions:
                type: array
                items:
                  type: integer
                description: User IDs mentioned in the comment
              created_at:
                type: string
                format: date-time
        investigation:
          allOf:
          - $ref: '#/components/schemas/AgentInvestigationSession'
          nullable: true
          description: The most recent agent investigation session for this exception, if any.
        investigation_sessions:
          type: array
          description: Up to the five most recent investigation sessions, newest first. Exceptions may accumulate multiple sessions as the overdue set evolves.
          items:
            $ref: '#/components/schemas/AgentInvestigationSession'
        review_counts:
          allOf:
          - $ref: '#/components/schemas/ReviewCounts'
          description: How many lines of the review are in each status. Zero everywhere until findings are written.
        reasons:
          type: array
          items:
            type: string
          description: Adjustment reasons already used on this reconciliation, most common first (at most 20). Offered as choices when a reviewer plugs a gap by hand. Only present on the show response.
    ExceptionAggregates:
      type: object
      description: Summary statistics for the (filtered) set of unmatched overdue records behind an exception.
      properties:
        record_count:
          type: integer
          description: Number of matching overdue unmatched records
        total_amount:
          type: integer
          description: Sum of signed amounts in cents (debits are negative)
        debit_count:
          type: integer
          description: Count of records with amount < 0
        debit_sum:
          type: integer
          description: Sum of debit amounts in cents (non-positive)
        credit_count:
          type: integer
          description: Count of records with amount > 0
        credit_sum:
          type: integer
          description: Sum of credit amounts in cents (non-negative)
        avg_age_days:
          type: number
          description: Average age in days since each record's `overdue_at`
        oldest_at:
          type: string
          format: date-time
          nullable: true
          description: Transaction date of the oldest record in the slice
        newest_at:
          type: string
          format: date-time
          nullable: true
          description: Transaction date of the newest record in the slice
    FindingsUpsertRequest:
      type: object
      required:
      - findings
      properties:
        findings:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/FindingInput'
    ReconciliationEntry:
      description: A record's entry in one reconciliation. Match status, escalation, and matched records are all scoped to that reconciliation; a record has one entry per reconciliation it participates in. `id` is the record id.
      allOf:
      - $ref: '#/components/schemas/Record'
      - type: object
        properties:
          reconciliation_id:
            type: integer
          reconciliation_name:
            type: string
          status:
            type: string
            enum:
            - reconciled
            - unreconciled
            description: Whether the record is matched in this reconciliation. Read-only.
          escalated:
            type: boolean
            description: Unmatched and past its `overdue_at`.
          overdue_at:
            type: string
            format: date-time
            nullable: true
          matched_records:
            type: array
            description: Records matched with this record in this reconciliation
            items:
              type: object
              properties:
                id:
                  type: integer
                amount:
                  type: integer
                  description: Amount in cents
                currency:
                  type: string
                  description: Three-letter ISO 4217 currency code (e.g. USD, EUR)
                  default: USD
                decimal_places:
                  type: integer
                  default: 2
                direction:
                  type: string
                  enum:
                  - credit
                  - debit
                description:
                  type: string
                date:
                  type: string
                  format: date
                external_id:
                  type: string
                data_stream_key:
                  type: string
                reconciliation_id:
                  type: integer
                  description: The reconciliation in which this match was made
                reconciliation_name:
                  type: string
                  description: Name of the reconciliation in which this match was made
          days_unreconciled:
            type: integer
            nullable: true
            description: Number of days since the record's date. Null when the record is reconciled.
          exception_id:
            type: integer
            nullable: true
            description: Open exception covering this entry's data stream when the entry is escalated. Null otherwise.
    FindingsUpsertResult:
      type: object
