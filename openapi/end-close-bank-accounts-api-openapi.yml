openapi: 3.2.0
info:
  title: End Close Bank Accounts API
  description: REST API is used to interact with the End Close platform.
  license:
    name: MIT
  version: 1.0.0
servers:
- url: https://api.endclose.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Bank Accounts
paths:
  /bank_accounts:
    get:
      summary: List bank accounts
      description: Returns all bank accounts for the current environment, ordered by name.
      responses:
        '200':
          description: List of bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankAccount'
        '401':
          description: Unauthorized
      tags:
      - Bank Accounts
      operationId: getBankAccounts
      x-operation-id-source: derived
    post:
      summary: Create a bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Human readable name for the bank account
                currency:
                  type: string
                  description: Three-letter ISO 4217 currency code (e.g. USD, EUR). Must be uppercase. Optional.
                  pattern: ^[A-Z]{3}$
                mask:
                  type: string
                  description: Last four digits of the account number, as it appears on statements. Set automatically for Plaid-linked accounts.
      responses:
        '201':
          description: Bank account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
      tags:
      - Bank Accounts
      operationId: postBankAccounts
      x-operation-id-source: derived
  /bank_accounts/{id}:
    get:
      summary: Retrieve a bank account
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: The unique identifier of the bank account
      responses:
        '200':
          description: Bank account retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
        '401':
          description: Unauthorized
        '404':
          description: Bank account not found
      tags:
      - Bank Accounts
      operationId: getBankAccountsById
      x-operation-id-source: derived
    patch:
      summary: Update a bank account
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: The unique identifier of the bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Human readable name for the bank account
                currency:
                  type: string
                  description: Three-letter ISO 4217 currency code (e.g. USD, EUR). Must be uppercase. Optional.
                  pattern: ^[A-Z]{3}$
                mask:
                  type: string
                  description: Last four digits of the account number, as it appears on statements. Set automatically for Plaid-linked accounts.
      responses:
        '200':
          description: Bank account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
        '401':
          description: Unauthorized
        '404':
          description: Bank account not found
      tags:
      - Bank Accounts
      operationId: patchBankAccountsById
      x-operation-id-source: derived
    delete:
      summary: Delete a bank account
      description: Permanently deletes a bank account. Returns 409 Conflict if the bank account has linked data streams.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: The unique identifier of the bank account
      responses:
        '204':
          description: Bank account deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Bank account not found
        '409':
          description: Cannot delete bank account because it has linked data streams
      tags:
      - Bank Accounts
      operationId: deleteBankAccountsById
      x-operation-id-source: derived
components:
  schemas:
    BankAccount:
      type: object
      required:
      - name
      properties:
        id:
          type: integer
          description: Unique numeric identifier
        name:
          type: string
          description: Human readable name for the bank account
        mask:
          type: string
          nullable: true
          description: Last four digits of the account number, as it appears on statements. Populated for Plaid-linked accounts.
        display_name:
          type: string
          description: 'Human label for the account: "Name (mask)" when a mask is known, otherwise just the name.'
        currency:
          type: string
          description: Three-letter ISO 4217 currency code (e.g. USD, EUR). Must be uppercase. Optional — bank accounts may be created without a currency.
          pattern: ^[A-Z]{3}$
          nullable: true
        role:
          type: string
          description: Canonical account role within a program. Null when the account has no declared role.
          enum:
          - fbo
          - ach_suspense
          - network_settlement
          - secondary_network
          - revenue
          - cardholder_adjustment
          - cash_load
          - unload_settlement
          - reserve
          - escheat
          - gl
          - operating
          nullable: true
          readOnly: true
        program:
          type: object
          description: The program this account belongs to, if any.
          nullable: true
          readOnly: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
x-provenance:
  method: harvested
  publisher: End Close
  source: https://www.endclose.com/docs/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
