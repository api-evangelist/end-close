name: End Close
description: >-
  End Close is an automated reconciliation platform for payments companies and other
  high-volume transaction businesses. Its REST API connects payment processors, bank
  accounts, and accounting systems, continuously matches transactions across those
  sources into reconciliations, surfaces exceptions with full context, and automates
  their resolution using rules and agents. The v1 API covers data streams, records,
  reconciliations, matches, rules, stories, exceptions, bank accounts and balances,
  bulk/async ingestion, and webhooks. Backed by Y Combinator.
